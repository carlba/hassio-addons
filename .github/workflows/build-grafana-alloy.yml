name: Build and Publish Grafana Alloy Addon

on:
  push:
    branches:
      - main
    paths:
      - grafana-alloy/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            build_arch: amd64
          - arch: aarch64
            build_arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' grafana-alloy/config.yaml | sed "s/version: *['\"]//g" | sed "s/['\"].*//" | tr -d ' ')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Addon version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./grafana-alloy
          push: true
          platforms: linux/${{ matrix.build_arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-grafana-alloy:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-grafana-alloy:latest
          build-args: |
            BUILD_ARCH=${{ matrix.build_arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-metadata:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' grafana-alloy/config.yaml | sed "s/version: *['\"]//g" | sed "s/['\"].*//" | tr -d ' ')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create release notes
        run: |
          echo "✅ Grafana Alloy addon v${{ steps.version.outputs.version }} published to GHCR"
          echo ""
          echo "**Prebuilt images available at:**"
          echo "- \`ghcr.io/${{ github.repository_owner }}/amd64-addon-grafana-alloy:${{ steps.version.outputs.version }}\`"
          echo "- \`ghcr.io/${{ github.repository_owner }}/aarch64-addon-grafana-alloy:${{ steps.version.outputs.version }}\`"
          echo ""
          echo "**Testing on your Raspberry Pi:**"
          echo "See workflow summary for reinstall instructions."
